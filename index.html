<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · 99 问答全景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b09;
  --surface: #161412;
  --surface-2: #1e1b18;
  --surface-3: #282420;
  --accent: #d4a843;
  --accent-dim: #a07e2e;
  --accent-glow: rgba(212, 168, 67, 0.12);
  --text: #e8e2d6;
  --text-muted: #8a8278;
  --text-dim: #5a554e;
  --border: #2a2622;
  --tag-bg: #1e1b16;
  --tag-text: #b8a878;
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --mono: 'JetBrains Mono', 'Menlo', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
}

::selection {
  background: var(--accent);
  color: var(--bg);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12, 11, 9, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: var(--bg);
  font-family: var(--mono);
}

.logo-text {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.logo-version {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  background: var(--surface-2);
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 4px;
}

.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--accent); }
.nav-links a.active { color: var(--accent); }

/* ===== HERO ===== */
.hero {
  max-width: 1400px;
  margin: 0 auto;
  padding: 5rem 2rem 2.5rem;
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.8s ease forwards;
}

.stat { text-align: center; }

.stat-number {
  font-family: var(--mono);
  font-size: 2.8rem;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
  display: block;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0.08em;
}

.hero-title {
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 2rem;
  animation: fadeUp 0.8s ease 0.15s forwards;
  opacity: 0;
}

.hero-title strong {
  color: var(--text);
  font-weight: 700;
}

/* ===== SEARCH ===== */
.search-container {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  animation: fadeUp 0.8s ease 0.3s forwards;
  opacity: 0;
}

.search-box {
  width: 100%;
  padding: 16px 20px 16px 52px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.search-box::placeholder { color: var(--text-dim); }

.search-box:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1.1rem;
  pointer-events: none;
}

.search-hint {
  text-align: center;
  margin-top: 12px;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
}

.search-hint kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 0.7rem;
}

/* ===== AI CHAT ===== */
.ai-section {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem 2.5rem;
}

.ai-card {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem;
  display: flex;
  align-items: center;
  gap: 3rem;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s ease 0.45s forwards;
  opacity: 0;
}

.ai-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(212, 168, 67, 0.06) 0%, transparent 70%);
  pointer-events: none;
}

.ai-info { flex: 1; }

.ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(212, 168, 67, 0.1);
  border: 1px solid rgba(212, 168, 67, 0.2);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.06em;
}

.ai-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.ai-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.ai-desc {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.7;
}

.ai-chat-area {
  flex: 1;
  max-width: 480px;
}

.ai-messages {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  height: 200px;
  overflow-y: auto;
  margin-bottom: 12px;
  font-size: 0.85rem;
  line-height: 1.7;
}

.ai-msg {
  margin-bottom: 0.8rem;
  padding: 8px 12px;
  border-radius: 8px;
}

.ai-msg.user {
  background: var(--surface-3);
  color: var(--text);
  margin-left: 2rem;
}

.ai-msg.bot {
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.1);
  margin-right: 2rem;
}

.ai-msg .source {
  display: inline;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent-dim);
  cursor: pointer;
}

.ai-msg .source:hover { color: var(--accent); }

.ai-input-row {
  display: flex;
  gap: 8px;
}

.ai-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}

.ai-input:focus { border-color: var(--accent-dim); }

.ai-send {
  padding: 10px 20px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.ai-send:hover { background: #e0b64e; }
.ai-send:active { transform: scale(0.97); }

/* ===== FILTERS & CONTROLS ===== */
.filters {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 1.5rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  animation: fadeUp 0.8s ease 0.5s forwards;
  opacity: 0;
}

.filter-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
  margin-right: 8px;
  letter-spacing: 0.06em;
}

.filter-btn {
  padding: 6px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-family: var(--serif);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--accent-dim);
  color: var(--text);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 700;
}

.filter-controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toggle-all-btn {
  padding: 5px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent);
  font-family: var(--serif);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}

.toggle-all-btn:hover {
  background: var(--surface-3);
  border-color: var(--accent-dim);
}

.filter-count {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ===== Q&A LIST ===== */
.qa-list {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 4rem;
  display: grid;
  gap: 16px;
}

.qa-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
  cursor: pointer;
}

.qa-item:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

.qa-item.open {
  border-color: rgba(212, 168, 67, 0.4);
}

.qa-question {
  padding: 1.2rem 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  user-select: none;
}

.qa-number {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.2);
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 2px;
  flex-shrink: 0;
}

.qa-q-text {
  flex: 1;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text);
}

.qa-tags {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 2px;
  flex-wrap: wrap;
}

.qa-tag {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--tag-text);
  background: var(--tag-bg);
  border: 1px solid rgba(184, 168, 120, 0.15);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.qa-toggle {
  color: var(--text-dim);
  font-size: 1.2rem;
  transition: transform 0.3s, color 0.3s;
  flex-shrink: 0;
  margin-top: 2px;
}

.qa-item.open .qa-toggle {
  transform: rotate(45deg);
  color: var(--accent);
}

/* 答案展示区域：默认展开 */
.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  opacity: 0;
}

.qa-item.open .qa-answer {
  max-height: 5000px;
  opacity: 1;
}

.qa-answer-inner {
  padding: 0 1.5rem 1.5rem;
  padding-left: calc(1.5rem + 14px + 44px);
}

.qa-answer-text {
  color: #c9c3b8;
  font-size: 0.95rem;
  line-height: 1.9;
  border-left: 2px solid var(--accent-dim);
  padding-left: 1.2rem;
}

.qa-answer-text p {
  margin-bottom: 0.8rem;
}

.qa-answer-text ul, .qa-answer-text ol {
  margin: 0.6rem 0 0.8rem 1.2rem;
}

.qa-answer-text li {
  margin-bottom: 0.4rem;
}

.qa-answer-text strong {
  color: var(--text);
  font-weight: 700;
}

.qa-cross-links {
  margin-top: 1.2rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.qa-cross-link {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--accent-dim);
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.15);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.qa-cross-link:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: rgba(212, 168, 67, 0.2);
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}

.empty-state .icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.empty-state p {
  font-size: 0.9rem;
}

/* ===== FOOTER ===== */
.footer {
  border-top: 1px solid var(--border);
  padding: 2rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero-stats { gap: 1.5rem; }
  .stat-number { font-size: 2rem; }
  .ai-card { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
  .ai-chat-area { max-width: 100%; width: 100%; }
  .qa-answer-inner { padding-left: 1.5rem; }
  .qa-tags { display: none; }
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 0.75rem; }
  .filter-controls { width: 100%; justify-content: space-between; margin-top: 10px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">KB</div>
      <span class="logo-text">知识库</span>
      <span class="logo-version">v1.0</span>
    </a>
    <nav class="nav-links">
      <a href="#" class="active">问答</a>
      <a href="#ai-section">AI 助手</a>
      <a href="#">关于</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-stats">
    <div class="stat">
      <span class="stat-number" id="totalCount">99</span>
      <span class="stat-label">问答条目</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="tagCount">0</span>
      <span class="stat-label">知识标签</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="linkCount">0</span>
      <span class="stat-label">交叉链接</span>
    </div>
  </div>
  <h1 class="hero-title">
    <strong>99 个问答全景</strong> · 一键检索 · 交叉溯源
  </h1>
  <div class="search-container">
    <span class="search-icon">⌕</span>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索问题、关键词、标签……" autocomplete="off">
    <div class="search-hint">按 <kbd>/</kbd> 聚焦搜索 · 按 <kbd>Esc</kbd> 清除</div>
  </div>
</section>

<!-- AI CHAT -->
<section class="ai-section" id="ai-section">
  <div class="ai-card">
    <div class="ai-info">
      <div class="ai-badge">BETA</div>
      <h2 class="ai-title">智能问答助手</h2>
      <p class="ai-desc">
        有疑问？直接提问，AI 基于知识库原文为你解答。<br>
        每个回答都会标注来源条目，方便溯源验证。
      </p>
    </div>
    <div class="ai-chat-area">
      <div class="ai-messages" id="aiMessages">
        <div class="ai-msg bot">
          你好！我可以基于知识库的 99 个问答为你解答。试试问我点什么？
        </div>
      </div>
      <div class="ai-input-row">
        <input type="text" class="ai-input" id="aiInput" placeholder="输入你的问题……">
        <button class="ai-send" id="aiSend">提问</button>
      </div>
    </div>
  </div>
</section>

<!-- FILTERS -->
<div class="filters" id="filters">
  <span class="filter-label">分类</span>
  <button class="filter-btn active" data-tag="all">全部</button>
  <div class="filter-controls">
    <button class="toggle-all-btn" id="toggleAllBtn" onclick="toggleAllCards()">折叠全部</button>
    <span class="filter-count" id="filterCount">显示 99 / 99</span>
  </div>
</div>

<!-- Q&A LIST -->
<div class="qa-list" id="qaList"></div>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState" style="display:none;">
  <div class="icon">⌕</div>
  <p>没有找到匹配的结果，试试其他关键词？</p>
</div>

<!-- FOOTER -->
<footer class="footer">
  知识库 v1.0 · 持续更新中
</footer>

<script>
// ==========================================
// 内置完整 99 条问答数据（完全避免外部加载失败）
// ==========================================
const QA_DATA = [
  {
    id: 1,
    q: "为什么第一幕不建议买短期美债？美股、美债与美元的“三位一体”危机梯次演进全景",
    a: "<p>在危机演进的第一幕中，美元和短期美债确实都可能会阶段性走强，但在大叔的周期课程与资产配置框架中，核心建议聚焦在两类工具：</p><ol><li><strong>降息预期飙升后配置长久期债券</strong>：在美联储降息预期大幅上升（流动性危机集中爆发）后买入长久期美债/国债，获取基准利率下行带来的巨大久期弹性资本利得；</li><li><strong>布局实物黄金与数字黄金</strong>：战略底仓宜在第二幕明确发生后大举加仓。</li></ol><p><strong>为什么不建议配置短期美债：</strong></p><ul><li><strong>流动性极值踩踏下的无差别抛售</strong>：流动性冲击爆发瞬间，市场为补缴保证金无差别抛售除纯美元现金外的一切金融资产，短债在恐慌极值点同样面临价格扰动。</li><li><strong>确定性与赔率考量</strong>：论避险与抗通胀终极确定性，黄金最强；论降息周期的弹性与资本利得赔率，长债远胜短债（短债久期资本利得极小，进入第二幕后仍需切换为黄金）。</li></ul><p><strong>三位一体危机传导链：</strong></p><p>【第一阶段：美股见顶下杀】→【第二阶段：长端美债暴跌】→【第三阶段：降息刺激长债】→【第四阶段：通胀二次反噬】→【第五阶段：美联储印钞购债】→【第六阶段：美元信用崩塌】</p>",
    tags: ["美债危机", "资产配置", "宏观传导"],
    links: [2, 3, 7, 20, 21]
  },
  {
    id: 2,
    q: "10年期美债收益率是资产之锚还是美股暴跌的引爆物？金融“五步反馈机制”全景拆解",
    a: "<p>两者都对，且相互强化：</p><ol><li><strong>宏观定价逻辑（资产定价之锚）</strong>：10年期美债收益率是全球无风险利率基准与DCF分母，收益率上升导致折现率走高，压缩权益估值、刺破泡沫（中长期基本面逻辑）。</li><li><strong>微观流动性逻辑（杠杆踩踏与补保证金）</strong>：股市暴跌时，机构面临Margin Call，为换取现金无差别抛售流动性最好的美债，导致美债价格下跌、收益率被动飙升（极短期微观冲击）。</li></ol><p><strong>金融“五步反馈链”：</strong></p><ul><li><strong>第一步（利率杀估值）</strong>：国债收益率走高刺破高估值股市泡沫；</li><li><strong>第二步（流动性冲击）</strong>：股市暴跌，机构抛售国债补保证金，收益率短期逆势冲高；</li><li><strong>第三步（避险买国债）</strong>：跌势确立，资金出逃买入国债避险，拉低收益率；</li><li><strong>第四步（自动稳定器生效）</strong>：收益率下行使股市跌势减缓/企稳；</li><li><strong>第五步（稳定器失效）</strong>：股市确定性下跌叠加国债价格继续崩跌，美债/主权信用危机全面爆发。</li></ul>",
    tags: ["美债收益率", "美股", "金融稳定器"],
    links: [1, 3, 20, 25, 77]
  },
  {
    id: 3,
    q: "债务危机转向货币危机有哪些标志性事件？美债收益率与美联储印钞如何演进？",
    a: "<p>从债务危机升级为货币危机有两个核心标志性事件：</p><ol><li><strong>标志性事件一：长端美债收益率飙升（引发金融流动性危机）</strong><ul><li>10年期与30年期美债收益率飙升（如30年期冲高至6%-7%），全球投资者大规模抛弃长债；</li><li>财政部陷入高成本发债或暂停发债的两难；银行及机构美债资产大幅缩水爆雷。</li></ul></li><li><strong>标志性事件二：美联储大规模购债（财政赤字货币化，引爆货币危机）</strong><ul><li>为避免金融崩溃，美联储被迫亲自下场买入长端美债人为托底；</li><li>直接进入“财政赤字货币化”，市场看穿天量超发真相，大规模抛售美元资产，美元指数断崖式暴跌，危机质变为<strong>主权货币信用危机</strong>。</li></ul></li></ol><p>整个反复博弈拉锯过程<strong>至少持续一年</strong>，直至大型金融机构实质性暴雷，美联储彻底不顾一切疯狂印钞接盘。</p>",
    tags: ["债务危机", "货币危机", "美联储印钞"],
    links: [1, 2, 4, 15, 34]
  },

    id: 4,
    q: "美元贬值与信用走弱下，大宗商品会立即货币化并持续通胀吗？三阶段推演",
    a: "<p><strong>不能一概而论，大宗商品货币化与持续通胀通常在“第三阶段”才会真正爆发：</strong></p><ul><li><strong>第一与第二阶段（衰退交易与流动性冲击）</strong>：市场核心交易衰退预期与流动性挤兑，实体需求萎缩压制大宗名义价格；美元出于避险和补缴保证金需求反向冲高走强。</li><li><strong>第三阶段（主权货币信用危机）</strong>：危机从债务暴雷升级为美联储大规模印钞接盘，美元开启不可逆的趋势性大幅贬值；此时大宗商品启动针对美元的剧烈上涨，本质是法币购买力缩水的大通胀。</li></ul>",
    tags: ["大宗商品", "美元信用", "通货膨胀"],
    links: [3, 15, 17, 70, 78]
  },

    id: 5,
    q: "远东见闻、俄乌终局与美债危机推演：全球将如何滑入地缘与秩序的大重组？",
    a: "<p><strong>一、俄罗斯经济与2027终局：</strong></p><ol><li>战线大概率在2027年冻结：主权财富基金流动性资金按目前消耗速度将在2027下半年耗尽；</li><li>停火后将面临2-3年严重经济阵痛与失业激增；</li><li>经济更深衰退时将放下戒心向中国实质性全面开放东部地区。</li></ol><p><strong>二、假定2027下半年美债危机爆发的三方推力：</strong></p><ul><li><strong>美国路径</strong>：放手让美元贬值（通胀稀释债务）+ 地缘大收缩并放任区域冲突升级驱赶避险资本回流本土。</li><li><strong>次级同盟国</strong>：日本、东欧等高负债国率先激进化，警惕边缘盟友制造摩擦绑架盟主的“柯林斯陷阱”。</li><li><strong>中国应对</strong>：底线为防止邻国跨越核门槛，由战略自主逐步走向反制与规则权力重构。</li></ul>",
    tags: ["地缘政治", "美债危机", "宏观推演"],
    links: [1, 3, 7, 38]
  },
  {
    id: 6,
    q: "7月营收跳增是否代表经济已经复苏？基钦周期领先指标与判定逻辑",
    a: "<p><strong>没有，经济仍在主动去库阶段，单月跳增未获领先指标“验真”。</strong></p><p>基钦周期传导大逻辑：<strong>货币与信贷（钱）→ 订单增加 → 营收增长 → 生产增长 → 库存增长</strong>。</p><ul><li><strong>指标优先级</strong>：<strong>领先指标（提醒）> 核心指标（定位）> 确认指标（验真）</strong>；</li><li><strong>领先指标现状</strong>：社融存量/增量、M1/M2同比处于低位下行，警示信号持续，缺乏信贷支撑的营收单月跳增属于脉冲波动；</li><li><strong>后续路径</strong>：尾部出清阶段指标可能加速下滑，需直至货币与信贷先行见底，方可确认向第9轮基钦周期切换。</li></ul>",
    tags: ["基钦周期", "领先指标", "宏观经济"],
    links: [7, 8, 39, 62, 84]
  },
  {
    id: 7,
    q: "为什么海外危机要持续三年，而中国却可以在2027年率先触底反弹？中美周期错位与历史性共振点(CRP)全景拆解",
    a: "<p>核心根源在于中美两国的<strong>“宏观周期错位”</strong>：</p><ul><li><strong>美国</strong>：处于宏观与资产价格极端高位（创新泡沫+财政信用高风险），泡沫出清与债务货币重塑需要2-3年；</li><li><strong>中国</strong>：处于周期极低位（产能深度出清+有效需求不足），为外部传导提供阶梯（美联储每降息一层/危机深化一分，中国政策空间打开一层）。</li></ul><p><strong>2027年历史性多周期共振点（CRP）：</strong></p><ol><li>第9轮基钦周期启动（库存见底回升）；</li><li>康波复苏大周期 + 第6轮朱格拉设备投资周期 + 库兹涅茨房地产出清回稳正向共振；</li><li>全球利率中枢下移叠加国内信贷与货币政策发力，资产价格率先迎来爆发。</li></ol>",
    tags: ["周期错位", "多周期共振", "CRP", "2027展望"],
    links: [1, 5, 24, 72, 83]
  },

    id: 8,
    q: "波斯湾冲突推迟PPI见顶后，基钦周期启动时点与股市高点如何修正？",
    a: "<ol><li><strong>基钦周期底线约束</strong>：历史上单轮基钦周期最长不超49个月，本轮自2023年3月算起，最迟不超2027年4月，<strong>大概率在2027年一季度开启第9轮</strong>；尾部加速断崖下滑属于“以空间换时间”。</li><li><strong>PPI见顶修正</strong>：地缘外生事件推波助澜，传导拉长至3个季度，7月PPI拐点回落已确立见顶趋势。</li><li><strong>顶部区间底层研判</strong>：社融、M1/M2与PPI三大先行指标掉头向下，市场向下概率远大于向上；长端美债收益率钉在高位对全球风险资产形成重压。</li><li><strong>大顶形态</strong>：呈现复杂震荡（大幅下跌→强力反弹→再次破位→反抽下杀→趋势确认）。</li></ol>",
    tags: ["基钦周期", "PPI", "股市见顶"],
    links: [6, 18, 54, 58, 84]
  },
  {
    id: 9,
    q: "买黄金应该选实物黄金还是黄金ETF？黄金股有何不同？",
    a: "<p><strong>一、黄金 ETF vs 实物黄金：</strong></p><ul><li><strong>黄金ETF</strong>：与现货金价高度贴合、交易成本极低、流动性强，适合<strong>根据宏观趋势做波段操作</strong>；缺点是盘中实时波动容易受恐吓过早离场。</li><li><strong>实物黄金</strong>：有加工费及回收折价，但交易繁琐<strong>“被动钝化”了短期恐慌</strong>，适合作为跨越数年的<strong>长波宏观底仓配置</strong>。</li></ul><p><strong>二、黄金股的特征：</strong></p><ol><li>商品价格走牛时，<strong>现货商品涨幅通常领先并大于股票</strong>；</li><li>上市公司业绩兑现受开采成本、套保策略、折旧及大盘整体估值折价等影响，存在经营迟滞与不确定性。</li></ol>",
    tags: ["黄金", "黄金ETF", "黄金股", "资产配置"],
    links: [1, 56, 81, 95, 99]
  },
  {
    id: 10,
    q: "7月宏观数据深度剖析与黄金冲击4000美元的三大底层支柱",
    a: "<p><strong>一、7月数据特征：</strong>生产资料与生活资料PPI“剪刀差”拉大（内需疲弱、成本推动）；制造业PMI重回收缩；外贸端AI硬件链条出口高景气；金融端社融与信贷放缓、M1与M2剪刀差显著（资金淤积）。</p><p><strong>二、黄金冲击4000美元的三大支柱：</strong></p><ol><li><strong>美债规模扩张与主权信用寻锚</strong>：公共债务/M2创30年新高（141），全球央行战略性购金对冲信用风险；</li><li><strong>美元利率“易下难上”与化债目标</strong>：沃什通胀框架重构为降息化债铺路，降息预期修复强力托底金价；</li><li><strong>供给瓶颈与极度稀缺性</strong>：全球探明储量仅5.5-6万吨，行业转入存量博弈抬升长期价值中枢。</li></ol>",
    tags: ["宏观数据", "黄金", "美债扩张"],
    links: [1, 3, 9, 27, 95]

    id: 11,
    q: "观点一致但结论不同的差异，是对周期和波动容忍度不同造成的吗？",
    a: "<ol><li><strong>美债问题的紧迫性</strong>：打压股市、干预日元汇率等手段均未能压低长端收益率，华尔街金融财技干预宣告失败，深层危机加速摊牌。</li><li><strong>港股AI与互联网平台底色</strong>：AI应用端机会大于上游硬件，国内互联网大厂处于深度低估区间；“港股急跌急涨”是宏观流动性特征，需区分市场环境与个股价值。</li><li><strong>平衡策略</strong>：<strong>等待是最优解，但绝对空仓不一定是最优解</strong>（留有应对产业与政策边际变化的弹性空间）。</li><li><strong>大泡沫顶部形态</strong>：本轮AI高景气业绩泡沫更类似<strong>1972年“漂亮50”</strong>（非2000年概念泡沫），呈现“波次向下、长达数月的圆弧顶”震荡形态。</li></ol>",
    tags: ["投资策略", "港股", "AI泡沫", "漂亮50"],
    links: [18, 46, 48, 65, 69]
  },

    id: 12,
    q: "周金涛的产能周期、大宗商品超级周期、涛动周期，和大叔课程中的房地产周期、朱格拉周期、基钦周期一样吗？有什么异同？",
    a: "<p>大叔对大宗商品本身研究不如周金涛深入。研究大宗商品不仅需要周期视角，还需要行业与产能视角。<strong>周期只能给出方向和大体时间，产能的收缩和扩张能给出更具体的时间，但拐点时刻往往由随机事件（如战争）决定</strong>。周金涛多给出了结论但部分逻辑未完全展开，需结合产能与事件链综合观察。</p>",
    tags: ["周金涛", "大宗商品", "周期理论"],

  {
    id: 13,
    q: "从自然利率平价看，美元指数有望长期强势，如何理解这个判断的逻辑？",
    a: "<p><strong>用自然利率平价推导美元长期走强属于工具与时间维度的错配。</strong></p><ul><li><strong>长期决定理论（巴拉萨-萨缪尔森效应）</strong>：决定两国长期汇率的是<strong>相对劳动生产率（全要素生产率）的提升速度</strong>与<strong>货币财政纪律</strong>。“货多，币才值钱”，货币长期锚定物质财富创造能力。</li><li><strong>现实三大修正变量</strong>：本币超发速度、本国央行汇率干预、对手国央行流动性周期。</li><li><strong>总结</strong>：利率平价/自然利率属于1-2年内的短期资金流向工具，长期预测必须依靠底层劳动生产率与主权债务纪律。</li></ul>",
    tags: ["美元指数", "汇率理论", "生产率", "利率平价"],
    links: [1, 3, 27, 34, 38]
  },

    id: 14,
    q: "关于大宗商品的几个问题（价格高低点判断、基钦周期内波动、白银是否低点）",
    a: "<p>决定资产价格的核心因素是<strong>稀缺性</strong>：</p><ul><li><strong>黄金 vs 白银</strong>：黄金至今依然稀缺，资产价格弹性高；白银稀缺性相对较低，价格弹性弱。</li><li><strong>行情特征</strong>：历史上金银比中枢在13-15倍，目前在70倍左右。当白银开始快速补涨飙升时，往往意味着黄金已处于高位滞涨阶段；盲目依据金银比买入易陷入资产陷阱。</li><li><strong>投资原则</strong>：应当买入真正稀缺的资产，而非“相对稀缺”的资产。</li></ul>",
    tags: ["大宗商品", "白银", "金银比", "稀缺性"],

    id: 15,
    q: "美元信用受损，大宗商品定价锚会不会向黄金实物信用迁移？",
    a: "<p>美元信用受损后，定价锚向黄金实物信用迁移的逻辑必然会发生，但<strong>关键在于发生的时间节点</strong>：</p><ul><li><strong>第一幕（流动性危机）不会发生</strong>：美股下跌、美债阶段反弹，流动性挤兑导致美元反直觉走强；</li><li><strong>第二幕（美债危机）不会发生</strong>：全球衰退预期蔓延，商品需求受压制；</li><li><strong>第三幕（美元信用崩塌）中后期必然发生</strong>：美联储无限量宽松导致美元断崖贬值，大宗商品、充沛现金流股票、贵金属及人民币等替代品将迎来超级重估。</li></ul>",
    tags: ["美元信用", "黄金", "大宗商品", "危机三幕戏"],

  {
    id: 16,
    q: "7月末美元跳水、日元异动与美债“三幕戏”推演：为什么日元升值是美债风险的关键温度计？",
    a: "<p><strong>一、核心信号与预判：</strong></p><p><strong>“日元快速升值 + 美债长端收益率飙升”</strong>是美债爆发系统性风险的关键温度计；2027年主基调大概率是日元大幅升值。</p><p><strong>二、日美利差倒挂与套息平仓机制：</strong></p><ul><li>跨境投资汇率掉期成本（120-180bp）超过了美日长端利差（约120bp），美债投资净收益转负；</li><li><strong>三大逆转主体</strong>：机构转舵（日本险资/养老金弃美债买日债）+ 套息交易踩踏平仓（Carry Trade Unwind抛美债买日元还贷）+ 海外企业留存利润加速回流。涉及广义流动性达15-20万亿美元。</li></ul><p><strong>三、三大核心观察温度计：</strong>美股走势、30年期美债收益率、日元汇率升值斜率。</p>",
    tags: ["日元升值", "美债危机", "套息交易", "Carry Trade"],
    links: [1, 2, 3, 18, 38]
  },
  {
    id: 17,
    q: "大宗商品价格波动与康波、朱格拉及库存周期有何联动关系？两次牛市机制全景拆解",
    a: "<p>大宗商品价格大涨在宏观大周期中主要出现两次：</p><ol><li><strong>第一次上涨（周期的“复苏前期”）</strong>：康波与朱格拉复苏共振，由<strong>实体需求回暖与产能刚性/极低供给弹性</strong>主导（上游资本开支在萧条期被大幅削减，扩产需3-4年建设周期），行情通常持续3-4年。</li><li><strong>第二次暴涨（周期的“繁荣后期至衰退初期”）</strong>：由<strong>全社会信用扩张与金融投机泡沫</strong>推动，异化为抗通胀金融投资品（如2008年原油冲上147美元，本轮长波共振预计在2046年前后）。</li></ol><p><strong>领涨品种</strong>取决于康波底层技术主线：第六次康波以AI与算力/电气化为驱动，因此领涨的是工业金属（铜、铝）而非传统原油。</p>",
    tags: ["大宗商品", "康波周期", "朱格拉周期", "工业金属"],
    links: [4, 71, 78, 81, 86]
  },
  {
    id: 18,
    q: "周期理论对股票投资的具体作用是什么？如何理解市场下跌的演进阶段？",
    a: "<p><strong>一、投资三层体系</strong>：第一层<strong>趋势/周期（定方向/仓位，决定91.5%收益差异）</strong>；第二层<strong>行业（定机会/赛道）</strong>；第三层<strong>公司（定价值/个股）</strong>。周期无法指导微观哪家企业先发芽，但能告诉你春天还是寒冬。</p><p><strong>二、市场下跌演进四大阶段：</strong></p><ol><li><strong>第一阶段（顶部拉锯）</strong>：心存幻想，多空反复震荡确认（约2-3个月）；</li><li><strong>第二阶段（共振加速）</strong>：全球股市齐跌、高景气行业降价、悲观预期放大；</li><li><strong>第三阶段（债务违约）</strong>：流动性收缩、日元升值套利平仓、主权债风暴显性化（主跌段）；</li><li><strong>第四阶段（机构危机）</strong>：系统重要性金融机构出险暴雷，断崖式暴跌（恐慌极值与历史建仓良机）。</li></ol>",
    tags: ["投资体系", "资产配置", "下跌四阶段"],
    links: [11, 21, 40, 58, 60]
  },
  {
    id: 19,
    q: "房地产周期有哪些核心理论与历史发展规律？",
    a: "<p><strong>一、两大核心理论先驱：</strong></p><ul><li><strong>霍伊特（Homer Hoyt）</strong>：总结芝加哥百年地价，提出房地产周期平均约22年（上行14年，下行8年），拆解出从人口流入、租金上涨、信贷扩张到投机爆仓、价格雪崩的<strong>20个传导步骤</strong>。</li><li><strong>哈里森（Fred Harrison）</strong>：扩展至全球200年历史，提出平均18年周期（14年扩张+4年调整），核心驱动是<strong>“信贷-土地反馈机制”</strong>。</li></ul><p><strong>二、双套逻辑咬合：</strong>实体层面解决居住（供求商品周期）；金融层面土地作为核心抵押品（金融加速器机制）。人口决定长期需求与空间分布，金融信用决定价格波动幅度。</p>",
    tags: ["房地产周期", "库兹涅茨周期", "霍伊特", "哈里森", "金融加速器"],
    links: [61, 76, 83, 96]
  },
  {
    id: 20,
    q: "当前美债长短端走势是否符合“熊平”？兼谈危机两幕戏与“宏观交易员的圣杯”",
    a: "<p><strong>一、形态定义：</strong></p><ul><li><strong>熊平</strong>：短端收益率飙升更快（交易紧缩/加息预期）；</li><li><strong>熊陡</strong>：长端收益率上升更快（交易美债供应过剩与主权财政信用恶化）。当前呈现复合形态。</li></ul><p><strong>二、危机两幕戏：</strong></p><ul><li><strong>第一幕（金融自动稳定器生效/宏观交易员的圣杯）</strong>：股市大跌触发通缩避险，资金涌入国债，长债收益率大跌、价格暴涨（走出“牛陡”）；</li><li><strong>第二幕（自动稳定器失效与信用出险）</strong>：长端发债失控、美联储被迫印钞购债，长债遭彻底抛售重回“熊陡”，转入法币主权信用危机。</li></ul><p><strong>三、策略：</strong>宏观高手第一幕买长债、第二幕切黄金；普通投资者可直接配置黄金（大道至简）。</p>",
    tags: ["美债", "熊平", "熊陡", "宏观交易员的圣杯", "黄金"],
    links: [1, 2, 3, 21, 77]
  },
  {
    id: 21,
    q: "面对美债危机与股市调整，配置中国长久期国债是否可行？危机的五步传导与大类资产配置路径",
    a: "<p><strong>配置中国长久期国债完全可行，是衰退与出清中后期的核心防守工具。</strong>中国国债锚定国内通胀与货币纪律，受国内基钦去库与降息周期支撑，不会被海外美债信用风暴带崩。</p><p><strong>危机全景演进五步传导链：</strong></p><ol><li><strong>第一步（避险初现）</strong>：抛弃风险资产，涌入无风险资产（现金、国债、黄金）；</li><li><strong>第二步（流动性挤兑）</strong>：无差别抛售一切资产补流动性，美元现金阶段性称王；</li><li><strong>第三步（政策救市）</strong>：央行开启天量QE，利率暴跌，国债与固收迎来确定性修复；</li><li><strong>第四步（通胀与重估）</strong>：财政赤字货币化，黄金成为终极避险王牌；</li><li><strong>第五步（全球资产重置）</strong>：资本寻找确定性，人民币汇率与人民币资产（先国债后核心股票）率先企稳反转。</li></ol>",
    tags: ["中国国债", "大类资产配置", "危机五步传导"],
    links: [1, 18, 20, 31, 32]
  },
  {
    id: 22,
    q: "国家对股市的调控能否打破或延长周期？如何看待当前A股高位震荡与美债反常波动？",
    a: "<p>国家队本质是平准基金（逆周期托底与平抑），<strong>政策可以改变节奏与波动，但无法打破周期轮回</strong>。</p><ol><li><strong>市场微观博弈真相</strong>：先行指标M1同比断崖下滑（确认货币信用收缩），敏锐主力已获利离场，反抽多为存量博弈。</li><li><strong>美债收益率反常异动</strong>：地缘冲突下长端收益率逆势飙升创多年新高，表明全球买家拒绝接盘，市场不再信任美国财政可持续性。</li><li><strong>交易决策象限</strong>：国内货币经济指标下滑 + 美债长端反常破位 + 美股高位异常 = <strong>赔率极小、胜率极小</strong>的最差象限，策略上应坚决保持保守防御。</li></ol>",
    tags: ["政策调控", "M1", "美债异动", "仓位管理"],
    links: [6, 18, 25, 41, 43]
  },
  {
    id: 23,
    q: "美国能否通过战争甚至反向收割全球资产来延缓债务危机？",
    a: "<p><strong>可能性极小。</strong></p><p>美债总规模已达40万亿美元（可交易约35万亿），每年利息支出超1万亿美元，体量过于庞大，非美国家金融资产难以填补。美国若有此能力，更可行的方式是“高通胀+金融压抑（低国债利率）”进行隐性掠夺，但目前全球买家正加速抛售美债；类似“债务冻结100年”的激进方案一旦实行，次日国债将彻底无人问津导致信用即刻崩塌。</p>",
    tags: ["美国债务", "地缘冲突", "金融压抑"],

    id: 24,
    q: "基钦周期与朱格拉周期如何嵌套？主升资产如何被识别爆炒？当前三周期负向共振预示着什么？",
    a: "<p><strong>一、朱格拉周期三大投资阶段：</strong></p><ol><li><strong>启动期（复苏）</strong>：主导产业订单激增、资本开支扩张，产生<strong>“未来泡沫”</strong>（当前阶段）；</li><li><strong>扩张期（繁荣）</strong>：技术扩散、业绩推动稳健上涨，蓝筹与主导龙头齐涨；</li><li><strong>成熟期（衰退）</strong>：繁荣衍生信用扩张，产生<strong>“货币/信用泡沫”</strong>。</li></ol><p><strong>二、当前三周期负向共振：</strong>基钦周期下行致货币信贷收缩 + 朱格拉资本开支阶段休整 + 资本市场“未来泡沫”压制。<strong>2027年将迎来多周期向上大拐点</strong>（基钦被动去库+朱格拉向上+地产见底）。</p>",
    tags: ["基钦周期", "朱格拉周期", "未来泡沫", "周期共振"],
    links: [7, 8, 29, 65, 83]
  },
  {
    id: 25,
    q: "当前股票市场的下跌会促成美国债务危机的发生吗？会提前到近期发生吗？",
    a: "<p>股市下跌本身不是债务危机的前提，但因美债已达临界点，<strong>美股崩盘可能成为压垮美债的最后一根稻草</strong>。</p><p><strong>负反馈传导链条：</strong>美股暴跌 → 杠杆机构为补缴保证金被迫无差别抛售美债变现 → 美债价格下跌、收益率进一步飙升 → 贴现率抬升导致美股进一步暴跌。传导属于一连串事件链，不会瞬间完成，但传导不结束危机就不会轻易画上句号。</p>",
    tags: ["美股崩盘", "美债危机", "流动性负反馈"],
    links: [1, 2, 27, 41, 43]
  },
  {
    id: 26,
    q: "美国能否通过稳定币、通胀稀释或拉爆非美国家来缓解美债问题？",
    a: "<p>这三类手段确实在使用，但均存在不可克服的局限：</p><ol><li><strong>稳定币（扩大需求）</strong>：对旧需求（现金）的替代效应大于新增效应；且持有者以投机者为主，价格极度敏感，危机时会率先抛售加剧波动。</li><li><strong>温和通胀（稀释债务）</strong>：债务核心在于利息负担，若利息支出已超可支配现金流，通胀稀释无法阻止债务越滚越大。</li><li><strong>拉爆非美（资本回流）</strong>：边际影响力减弱时，非美经济体不会甘当被动牺牲品，反而加速去美元化各寻出路。</li></ol>",
    tags: ["稳定币", "通货膨胀", "美债化解", "美元霸权"],
    links: [3, 23, 27, 33]
  },

    id: 27,
    q: "美债能否依靠本土资金与AI驱动软着陆？长波债务周期与美元地位如何推演？",
    a: "<p><strong>一、持有者结构恶化</strong>：外国央行等非价格敏感买家减少，对冲基金（基差套利等）占比接近9%，杠杆极高且随时抛售。</p><p><strong>二、长波债务周期的硬约束</strong>：美债处于70-100年的长波债务周期顶峰，进入庞氏融资阶段（财政收入无法覆盖利息），AI生产率提升速度短期赶不上付息压力与债务滚雪球。</p><p><strong>三、美元与美股连锁</strong>：当前长端利率高企钉在危险区，一旦美股出现流动性收缩性崩盘，将触发杠杆踩踏与美债信用质变。</p>",
    tags: ["美债软着陆", "长波债务周期", "基差交易", "AI生产率"],
    links: [3, 10, 25, 41, 43]
  },

    id: 28,
    q: "科技股高位转入相对低位防御性资产是否安全？如何从资金博弈与周期逻辑看待板块切换？",
    a: "<p>从估值差看，资金从不赚钱的科技流入低位防御资产符合博弈逻辑。但从周期历史规律看：<strong>朱格拉周期启动期的主线是“未来泡沫”，一旦主线的未来泡沫破裂消失，防御性资产的上涨通常也难以长期维系</strong>。美股传统防御资产上涨亦多为此类阶段性现象。</p>",
    tags: ["板块切换", "防御资产", "未来泡沫", "资金博弈"],
    links: [11, 24, 60, 61, 65]
  },
  {
    id: 29,
    q: "经济数据疲软下A股是否会加速下跌？如何基于朱格拉周期推演未来的投资路线图？",
    a: "<p>资产价格由<strong>未来现金流（实体周期决定）/ 折现率（驱动周期决定）</strong>构成。当前分母端未变，分子端指标转弱带来预期差修正。</p><p><strong>朱格拉周期三阶段与投资路线图：</strong></p><ol><li><strong>启动期（未来泡沫）</strong>：主导产业资本开支启动，呈现K型分化，涨<strong>“卖铲人”</strong>（当前阶段）；</li><li><strong>扩张期（业绩推动）</strong>：主导产业盈利扩散，涨<strong>“修路人”</strong>，实体回报高、无泡沫但稳健长牛；</li><li><strong>成熟期（繁荣泡沫）</strong>：基建成熟服务业爆发，涨<strong>“加油站/饭店”</strong>应用端，叠加地产与信用共振爆发大泡沫。</li></ol>",
    tags: ["朱格拉周期", "DCF模型", "资产定价", "投资路线图"],

  {
    id: 30,
    q: "有哪些适合构建宏观与经济分析逻辑推荐阅读的书籍？",
    a: "<p><strong>核心推荐书单：</strong></p><ul><li>米尔顿·弗里德曼《<strong>货币的祸害</strong>》（货币学启蒙经典）；</li><li>林毅夫《<strong>经济学方法论</strong>》（经济学思维与对话启蒙）；</li><li>约翰·戈登《<strong>伟大的博弈</strong>》（华尔街与经济史观启蒙）；</li><li>安格斯·麦迪森《<strong>世界经济千年史</strong>》（经典计量经济史）；</li><li>刘鹤主编《<strong>两次大危机的比较研究</strong>》（宏观危机总论非常出色）。</li></ul>",
    tags: ["书籍推荐", "经济史", "宏观思维"],

    id: 31,
    q: "如何看待央行关于深化对港金融合作的表态？当前货币政策面临怎样的外部约束与打开契机？",
    a: "<p>当前中美利差深度倒挂，央行受制于汇率与外部环境约束，难以进行总量大水漫灌，只能采取<strong>“积极预期管理 + 结构性定向宽松”</strong>。只有当海外危机实质性爆发、美联储开启降息潮时，我国总量货币政策的操作空间才会被彻底打开。</p>",

    id: 32,
    q: "国家是否开启了新的港币资金周期？对港股短长期走势有何影响？",
    a: "<p><strong>一、短期逻辑（强人民币资产洼地）</strong>：美元走强背景下人民币表现坚韧，外资对中国资产信心边际修复，港股估值处于全球极低洼地，迎来资金流入与超跌修复。</p><p><strong>二、长期逻辑（流动性敏感度）</strong>：港元实行联系汇率制紧锚美元，若全球流动性危机或美股崩盘爆发，离岸港股通常最先承受流动性抽水冲击。</p>",
    tags: ["港股", "联系汇率制", "港币资金", "流动性"],
    links: [11, 21, 31, 48]
  },
  {
    id: 33,
    q: "AI与稳定币是否有可能推动“美元换锚”至智能/算力美元？美国能否举国之力避免美股大跌？",
    a: "<ol><li><strong>稳定币无法作为新锚</strong>：稳定币底层抵押品依然是美元与美债，只是交易形态转换，不能成为独立新锚。</li><li><strong>举国之力难挡周期规律</strong>：政策托底如出台刺激法案，中国房地产周期的演进已证明人为意志无法扭转资产定价公式（未来现金流/折现率）的边际恶化。</li><li><strong>核心拷问</strong>：科技巨头远期现金流能否支撑高估值？长端利率是否持续压制？AI乐观预期是否会在未来面临预期差调整？</li></ol>",

    q: "内债与外债有何本质区别？美债危机与货币信用坍塌的底层推演逻辑是什么？",
    a: "<p><strong>一、内债与通胀代价：</strong>拥有本币货币主权的国家不易发生偿付违约，但通胀与货币信用坍塌是其最终代价。</p><p><strong>二、中美危机治理路径差异：</strong></p><ul><li><strong>中国（通缩型债务）</strong>：走危机治理四步法（<strong>财政收缩 → 债务重组打破刚兑 → 节制放水 → 财富再分配/新质生产力</strong>）；</li><li><strong>美国（通胀型债务）</strong>：依赖“安全+增长”叙事输出通胀。当AI增长故事面临预期差、且信用规则被破坏时，输出机制将崩塌。</li></ul><p><strong>三、终局推演：</strong>美国解决债务压力的终极途径是<strong>一次性大幅贬值美元（大清算）</strong>，导火索大概率是由资产价格（股市）崩盘引爆。</p>",
    tags: ["内债与外债", "债务危机", "美元贬值", "危机治理四步法"],
    links: [3, 13, 23, 27]
  },

    q: "如何看待关于“大盘指数见顶但半导体/科技板块大涨”的背离？周期推演下的后续走势如何？",
    a: "<p>上证指数代表市场总体，科创代表K型经济的上半部分。在历史牛市末期（如2021年新能源行情），往往会出现市场广度迅速收窄、仅剩单一主线板块疯狂飙升的现象。需通过<strong>周期四问（位置、力量、方向、风险）</strong>看清大势，警惕狂热背后的结构性风险。</p>",

    a: "<ol><li><strong>消费意愿的财富效应</strong>：股市繁荣推升资产溢价与短线消费意愿，但属于顺周期结果；</li><li><strong>繁荣假象与危机爆发</strong>：历史上危机爆发前夕往往呈现出一片繁荣与消费狂热（如二战后及1969-1974大跌前），强劲消费体感并不能作为阻断危机的护城河；</li><li><strong>超额储蓄耗尽与借贷消费</strong>：底层数据已显示信用卡债务创历史新高、逾期率快速攀升，微观体感掩盖了信贷扩张的透支。</li></ol>",

    q: "周期中是否有调整幅度的参考指标？如何从周期叠加看待后续资产价格空间？",
    a: "<p>资本市场的调整幅度受制于<strong>货币与信贷周期</strong>，而货币信贷又受制于实体经济周期：</p><ol><li><strong>当前基钦周期较弱</strong>：下半年到明年初会倒逼出较大幅度的货币与信贷宽松；</li><li><strong>接续周期为强周期</strong>：第9轮基钦周期的启动将叠加多周期向上共振，货币流通速度加快会将宽松效应成倍放大，为后续资产价格打开空间。</li></ol>",

    q: "日元汇率跌破历史关口会否引发全球金融危机？日本经济与日本危机传导路径如何推演？",
    a: "<p><strong>日元贬值反映其相对劳动生产率削弱与息差套利。</strong></p><p>日本危机的真正命门不在于本币国债（属内债），而在于<strong>庞大的海外投资头寸（约3.5万亿美元）与高杠杆流动性陷阱</strong>。</p><p><strong>传导路径：</strong>美联储维持高利率 → 日元套利规模扩张 → <strong>美国资产价格暴跌</strong> → 资金集中平仓抛售美债换回美元 → 美元流动性收缩 → 全球套利者对日本失去信心 → 日元与日本金融资产承受剧烈冲击。日本风险爆发大概率滞后于美国风险。</p>",

    q: "当前阶段属于“主动去库”还是“被动补库”？如何通过基钦周期与领先指标推演大盘走势？",
    a: "<p><strong>当前依然属于第8轮基钦周期的“主动去库阶段”。</strong></p><ul><li>表面上企业营收和库存因原材料涨价预期出现脉冲式同步反弹，但缺乏“订单率先增长”的真实需求拉动；</li><li><strong>硬传导逻辑仍在起效</strong>：<strong>信贷收缩 → 货币收缩 → 工业增加值/消费下滑 → PMI订单回落</strong>。应重点关注PMI生产/订单等领先与核心指标，而非滞后的利润指标。</li></ul>",

    a: "<ol><li><strong>定性顺序固定，传导时间动态</strong>：周期的传导逻辑链条是严密的，但时间节点受外生变量扰动呈现概率分布；</li><li><strong>左侧交易 vs 右侧交易</strong>：顶级投资家在胜率与赔率变差时主动左侧减仓，不赚最后一个铜板；散户的心魔在于“既缺乏对高点的判断力，又不愿放弃每一个赚钱机会”；</li><li><strong>投资真谛</strong>：学周期是为了<strong>看清大方向并把有限精力投入大概率事件</strong>，依靠模糊的正确与仓位管理控制风险。</li></ol>",

    a: "<p>美国官方非常清楚美债风险，2025年关税摩擦与2026年利率破位均因美债基差交易爆仓风险而迅速妥协。</p><p><strong>系统性危机催化与演进链条：</strong></p><p>美股下跌 → 流动性收缩 → <strong>对冲基金基差交易爆仓</strong> → 货币市场基金挤兑 → 商业银行违约 → 私募贷违约 → 货币窖藏与流动性大收缩 → 美债评级被调降 → 危机全面爆发。</p>",

    a: "<p>“留足余地”指建立风险缓冲垫：</p><ol><li>美债危机爆发将引致全球深度衰退；</li><li>存量衰退加剧地缘与实物资源争夺，造成大宗与金融资产剧烈宽幅震荡；</li><li>极端波动会重创市场风险偏好，<strong>唯有持有充足流动性现金资产，才能在危机砸出的黄金坑中从容建仓</strong>。</li></ol>",

    a: "<p><strong>一、区分三大逻辑：</strong>公司商业战略在正轨（人车家生态、大模型技术底座扎实），但离岸港股受宏观流动性抽水与外资提款影响极大，短期价格暴跌属于金融逻辑压制，不能苛求企业为宏观流动性买单。</p><p><strong>二、回购的局限性：</strong>在系统性流动性退潮面前，企业有限的现金回购不过是杯水车薪，盲目耗尽现金甚至会危及企业研发与经营生存（如通用汽车杜兰特前车之鉴）。认知需匹配周期的客观规律。</p>",

    a: "<ol><li><strong>扎堆上市的历史规律</strong>：历史量化统计表明，当新科技概念公司扎堆批量IPO上市时，往往对应着阶段性流动性见顶与市场调整；</li><li><strong>产业 vs 金融逻辑</strong>：产业发展是10年长期趋势，但短期由资金与估值决定；</li><li><strong>资本开支突停风险</strong>：若海外流动性骤然紧缩引爆美债危机，AI科技巨头资本开支随时可能阶段性休整暂停（如2000年互联网泡沫时期），高估值成长股将面临估值下修。</li></ol>",

    q: "外资为何持续卖出港股致其频创新低？港币联系汇率制度在资金流动中扮演了什么角色？",
    a: "<p>港股呈现“跌得深、弹得猛”的底层原因在于<strong>联系汇率制</strong>：</p><ul><li>港元紧密挂钩美元，外资卖出港股后可无缝换回等同美元的流动性，<strong>无需承担货币贬值的双重汇率损失</strong>；</li><li>若卖出非美元锚定市场的资产，换汇时面临该国本币贬值折损。因此，外资在全球流动性紧张调仓撤资时，港股往往最先充当“全球提款机”。</li></ul>",

    q: "如何看待“硅基经济”时代普通人通过资本市场分享技术跃迁红利的逻辑？",
    a: "<p><strong>一、时代增长范式转移：</strong>增长由传统人口红利、地产与消费，全面转向以AI、半导体、算力、先进制造为主导的高生产率“硅基经济”。由于高精尖产业直接吸纳就业人数有限，普通人难以通过工资收入分享红利。</p><p><strong>二、资本市场的核心意义：</strong>资本市场成为普通人分享高生产率部门财富分配的入口。<strong>真正的价值投资是用合理价格长期配置代表未来生产率跃迁、具备全球竞争力并能持续扩大现金流的优质资产</strong>，而非盲目借贷投机。</p>",

    id: 50,
    q: "市场对7-10个月调整周期的怀疑与政策定向宽松背景下的分化体感",
    a: "<p>在宏观周期见大顶与见大底阶段，市场情绪往往极易随高频波动发生动摇。政策定向滴灌与普惠网托底使得指数难以单边暴跌，但若缺乏宏观总需求支撑，两极分化的K型行情会导致非科技板块体感极差。坚定遵循周期纪律、“壮士断腕”或保持定力，是避免成为追涨杀跌韭菜的关键。</p>",

    q: "现金流优异的英伟达为何在美债高利率下跨期限发债？发债背后的深层逻辑是什么？",
    a: "<p>大科技公司在高利率环境下跨期限发行2-30年固定利率长期债券的核心逻辑：</p><ol><li><strong>锁定长期成本与对冲长期通胀</strong>：预期未来将长期处于高通胀环境，未来实际利率将非常低甚至为负，债务会被通胀稀释；</li><li><strong>备足现金弹药储备防范市场风险</strong>：预感到未来资本市场或流动性可能出现动荡，提前锁定充沛现金；</li><li><strong>避免稀释股权且保有赎回灵活性</strong>。</li></ol>",

    a: "<p><strong>不会根本改变。</strong></p><ol><li>地缘协议约束力脆弱；</li><li>生产资料价格传导需要时间，在估值已高阶段，短期利好更易沦为资金借利好出货的窗口；</li><li>中国面临通缩与有效需求不足约束，极低名义利率（如10年期国债1.73%）虽提供支撑，但缺乏信贷扩张，市场只能呈现极致结构分化；二至三季度顶部区间预判依然有效。</li></ol>",

    a: "<p><strong>一、逻辑分层：</strong>小逻辑（地下管网等产业政策） < 中逻辑（朱格拉设备/AI基础设施及市场风格） < <strong>大逻辑（康波AI技术革命）</strong>。</p><p><strong>二、主线与资产优选：</strong></p><ol><li><strong>科技主线</strong>：朱格拉主线中，AI目前处于第一阶段，未来将向大模型平台与垂直应用演进；</li><li><strong>蓝筹估值防御</strong>：部分消费、医药蓝筹跌回2024年启动位，股息率与增长具备高确定性，第9轮基钦周期启动时风格有望呈现<strong>“先蓝筹后科技”</strong>。</li></ol>",

    a: "<p><strong>一、通胀四阶段演进：</strong>①通胀预期形成（抢购资产）→ ②<strong>通胀快速上升（成本转嫁困难、需求转弱、紧缩预期打压成长股，当前阶段）</strong>→ ③加息落地（资产齐跌）→ ④滞胀阶段。</p><p><strong>二、实际负利率的虚火：</strong>从生产者角度看PPI高于名义利率形成“负利率”，但上游原材料暴涨会反向挤压下游终端需求，导致需求萎缩与负反馈；国内PPI向CPI传导受阻亦印证终端消费疲弱对价格的反向约束。</p>",

    a: "<p>单纯持有现金流资产避险的前提是<strong>该资产必须具备向下游强力转嫁通胀的能力</strong>：</p><ul><li><strong>强转嫁能力</strong>：农产品、生鲜及生活必需品（刚需且随石化/原材料成本顺价提价）；</li><li><strong>弱转嫁能力</strong>：竞争激烈的可选消费与服务业；</li><li><strong>无转嫁能力</strong>：重资产、高负债的传统制造与地产（承受成本与加息财务费用双重挤压）。</li></ul><p>温和通胀利好资产，但进入快速通胀加息期将演变为“通胀无牛市”。</p>",

    a: "<p>周期的本质是：<strong>经济失衡积累 → 拐点事件爆发 → 链式传导 → 漫长修复重建</strong>。</p><p><strong>全球市场失衡拐点已逼近：</strong></p><ul><li><strong>进水管拧紧</strong>：全球脱离降息周期（美通胀受阻无法降，中降息空间受限）；</li><li><strong>出水管扩大</strong>：大宗与科技资产飙升吞噬天量流动性。</li><li><strong>边际资金决策公式</strong>：<strong>边际资金流向 = 预期投资回报率 - 资金成本</strong>。高位资产隐含回报率走低叠加资金成本抬升，边际资金必然流出触发逆转。</li></ul>",

// ==========================================
// 核心业务交互逻辑
// ==========================================
const qaList = document.getElementById('qaList');
const searchInput = document.getElementById('searchInput');
const filtersContainer = document.getElementById('filters');
const filterCount = document.getElementById('filterCount');
const emptyState = document.getElementById('emptyState');
const aiMessages = document.getElementById('aiMessages');
const aiInput = document.getElementById('aiInput');
const aiSend = document.getElementById('aiSend');
const toggleAllBtn = document.getElementById('toggleAllBtn');

let activeTag = 'all';
let searchQuery = '';
let isAllExpanded = true; // 默认全部展开

function initApp() {
  document.getElementById('totalCount').textContent = QA_DATA.length;
  const allTags = [...new Set(QA_DATA.flatMap(q => q.tags || []))].sort();
  document.getElementById('tagCount').textContent = allTags.length;
  document.getElementById('linkCount').textContent = QA_DATA.reduce((sum, q) => sum + (q.links ? q.links.length : 0), 0);

  const controlsDiv = document.querySelector('.filter-controls');
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    filtersContainer.insertBefore(btn, controlsDiv);
  });

  renderList();
}

function renderList() {
  const filtered = QA_DATA.filter(item => {
    const matchTag = activeTag === 'all' || (item.tags && item.tags.includes(activeTag));
    const matchSearch = !searchQuery ||
      (item.q && item.q.toLowerCase().includes(searchQuery)) ||
      (item.a && item.a.toLowerCase().includes(searchQuery)) ||
      (item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery)));
    return matchTag && matchSearch;
  });

  filterCount.textContent = `显示 ${filtered.length} / ${QA_DATA.length}`;

  if (filtered.length === 0) {
    qaList.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  qaList.innerHTML = filtered.map((item) => `
    <div class="qa-item open" data-id="${item.id}">
      <div class="qa-question" onclick="toggleQA(this.parentElement)">
        <span class="qa-number">#${String(item.id).padStart(2, '0')}</span>
        <span class="qa-q-text">${highlightText(item.q)}</span>
        <div class="qa-tags">
          ${(item.tags || []).map(t => `<span class="qa-tag">${t}</span>`).join('')}
        </div>
        <span class="qa-toggle">+</span>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-text">${highlightText(item.a)}</div>
          ${item.links && item.links.length > 0 ? `
            <div class="qa-cross-links">
              <span style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);margin-right:4px;">关联条目 →</span>
              ${item.links.map(l => {
                const linked = QA_DATA.find(q => q.id === l);
                return linked ? `<a class="qa-cross-link" onclick="scrollToQA(${l})">#${String(l).padStart(2,'0')} ${linked.q.slice(0,14)}…</a>` : '';
              }).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function highlightText(text) {
  if (!text) return '';
  if (!searchQuery) return text;
  const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark style="background:var(--accent);color:var(--bg);padding:0 2px;border-radius:2px;">$1</mark>');
}

function toggleQA(el) {
  el.classList.toggle('open');
}

function toggleAllCards() {
  const items = document.querySelectorAll('.qa-item');
  isAllExpanded = !isAllExpanded;
  items.forEach(item => {
    if (isAllExpanded) {
      item.classList.add('open');
    } else {
      item.classList.remove('open');
    }
  });
  toggleAllBtn.textContent = isAllExpanded ? '折叠全部' : '展开全部';
}

function scrollToQA(id) {
  const el = document.querySelector(`.qa-item[data-id="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('open');
    el.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => el.style.boxShadow = '', 2000);
  }
}

filtersContainer.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  filtersContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeTag = e.target.dataset.tag;
  renderList();
});

let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderList();
  }, 200);
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== aiInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchQuery = '';
    searchInput.blur();
    renderList();
  }
});

function sendAIMessage() {
  const question = aiInput.value.trim();
  if (!question) return;

  const userDiv = document.createElement('div');
  userDiv.className = 'ai-msg user';
  userDiv.textContent = question;
  aiMessages.appendChild(userDiv);

  const keywords = question.toLowerCase().split(/[\s,，。？！?!.]+/).filter(k => k.length > 1);
  const scored = QA_DATA.map(item => {
    let score = 0;
    const text = (item.q + ' ' + item.a + ' ' + (item.tags || []).join(' ')).toLowerCase();
    keywords.forEach(kw => {
      if (text.includes(kw)) score += 1;
      if (item.q && item.q.toLowerCase().includes(kw)) score += 2;
    });
    return { ...item, score };
  }).filter(item => item.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

  const botDiv = document.createElement('div');
  botDiv.className = 'ai-msg bot';

  if (scored.length > 0) {
    let html = `<div style="margin-bottom:8px;">根据知识库，找到 ${scored.length} 个相关条目：</div>`;
    scored.forEach((item, i) => {
      const plainA = (item.a || '').replace(/<[^>]*>/g, '');
      html += `<div style="margin-bottom:10px;">`;
      html += `<strong>${i + 1}.</strong> ${plainA.slice(0, 100)}…<br>`;
      html += `<span class="source" onclick="scrollToQA(${item.id})">📎 来源: #${String(item.id).padStart(2, '0')}「${item.q.slice(0, 25)}」</span>`;
      html += `</div>`;
    });
    botDiv.innerHTML = html;
  } else {
    botDiv.innerHTML = '抱歉，知识库中暂未找到与该问题直接相关的内容。<br>试试换个关键词提问？';
  }

  aiMessages.appendChild(botDiv);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  aiInput.value = '';
}

aiSend.addEventListener('click', sendAIMessage);
aiInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendAIMessage();
});

// 初始化
initApp();
</script>
</body>
</html>
