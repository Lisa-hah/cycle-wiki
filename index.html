<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · 99 问答全景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b09;
  --surface: #161412;
  --surface-2: #1e1b18;
  --surface-3: #282420;
  --accent: #d4a843;
  --accent-dim: #a07e2e;
  --accent-glow: rgba(212, 168, 67, 0.12);
  --text: #e8e2d6;
  --text-muted: #8a8278;
  --text-dim: #5a554e;
  --border: #2a2622;
  --tag-bg: #1e1b16;
  --tag-text: #b8a878;
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --mono: 'JetBrains Mono', 'Menlo', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
}

::selection {
  background: var(--accent);
  color: var(--bg);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12, 11, 9, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: var(--bg);
  font-family: var(--mono);
}

.logo-text {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.logo-version {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  background: var(--surface-2);
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 4px;
}

.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--accent); }
.nav-links a.active { color: var(--accent); }

/* ===== HERO ===== */
.hero {
  max-width: 1400px;
  margin: 0 auto;
  padding: 5rem 2rem 2.5rem;
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.8s ease forwards;
}

.stat { text-align: center; }

.stat-number {
  font-family: var(--mono);
  font-size: 2.8rem;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
  display: block;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0.08em;
}

.hero-title {
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 2rem;
  animation: fadeUp 0.8s ease 0.15s forwards;
  opacity: 0;
}

.hero-title strong {
  color: var(--text);
  font-weight: 700;
}

/* ===== SEARCH ===== */
.search-container {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  animation: fadeUp 0.8s ease 0.3s forwards;
  opacity: 0;
}

.search-box {
  width: 100%;
  padding: 16px 20px 16px 52px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.search-box::placeholder { color: var(--text-dim); }

.search-box:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1.1rem;
  pointer-events: none;
}

.search-hint {
  text-align: center;
  margin-top: 12px;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
}

.search-hint kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 0.7rem;
}

/* ===== AI CHAT ===== */
.ai-section {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem 2.5rem;
}

.ai-card {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem;
  display: flex;
  align-items: center;
  gap: 3rem;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s ease 0.45s forwards;
  opacity: 0;
}

.ai-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(212, 168, 67, 0.06) 0%, transparent 70%);
  pointer-events: none;
}

.ai-info { flex: 1; }

.ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(212, 168, 67, 0.1);
  border: 1px solid rgba(212, 168, 67, 0.2);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.06em;
}

.ai-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.ai-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.ai-desc {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.7;
}

.ai-chat-area {
  flex: 1;
  max-width: 480px;
}

.ai-messages {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  height: 200px;
  overflow-y: auto;
  margin-bottom: 12px;
  font-size: 0.85rem;
  line-height: 1.7;
}

.ai-msg {
  margin-bottom: 0.8rem;
  padding: 8px 12px;
  border-radius: 8px;
}

.ai-msg.user {
  background: var(--surface-3);
  color: var(--text);
  margin-left: 2rem;
}

.ai-msg.bot {
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.1);
  margin-right: 2rem;
}

.ai-msg .source {
  display: inline;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent-dim);
  cursor: pointer;
}

.ai-msg .source:hover { color: var(--accent); }

.ai-input-row {
  display: flex;
  gap: 8px;
}

.ai-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}

.ai-input:focus { border-color: var(--accent-dim); }

.ai-send {
  padding: 10px 20px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.ai-send:hover { background: #e0b64e; }
.ai-send:active { transform: scale(0.97); }

/* ===== FILTERS & CONTROLS ===== */
.filters {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 1.5rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  animation: fadeUp 0.8s ease 0.5s forwards;
  opacity: 0;
}

.filter-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
  margin-right: 8px;
  letter-spacing: 0.06em;
}

.filter-btn {
  padding: 6px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-family: var(--serif);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--accent-dim);
  color: var(--text);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 700;
}

.filter-controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toggle-all-btn {
  padding: 5px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent);
  font-family: var(--serif);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
}

.toggle-all-btn:hover {
  background: var(--surface-3);
  border-color: var(--accent-dim);
}

.filter-count {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ===== Q&A LIST ===== */
.qa-list {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 4rem;
  display: grid;
  gap: 16px;
}

.qa-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
  cursor: pointer;
}

.qa-item:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

.qa-item.open {
  border-color: rgba(212, 168, 67, 0.4);
}

.qa-question {
  padding: 1.2rem 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  user-select: none;
}

.qa-number {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.2);
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 2px;
  flex-shrink: 0;
}

.qa-q-text {
  flex: 1;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text);
}

.qa-tags {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 2px;
  flex-wrap: wrap;
}

.qa-tag {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--tag-text);
  background: var(--tag-bg);
  border: 1px solid rgba(184, 168, 120, 0.15);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.qa-toggle {
  color: var(--text-dim);
  font-size: 1.2rem;
  transition: transform 0.3s, color 0.3s;
  flex-shrink: 0;
  margin-top: 2px;
}

.qa-item.open .qa-toggle {
  transform: rotate(45deg);
  color: var(--accent);
}

/* 答案展示区域：默认展开 */
.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  opacity: 0;
}

.qa-item.open .qa-answer {
  max-height: 5000px;
  opacity: 1;
}

.qa-answer-inner {
  padding: 0 1.5rem 1.5rem;
  padding-left: calc(1.5rem + 14px + 44px);
}

.qa-answer-text {
  color: #c9c3b8;
  font-size: 0.95rem;
  line-height: 1.9;
  border-left: 2px solid var(--accent-dim);
  padding-left: 1.2rem;
}

.qa-answer-text p {
  margin-bottom: 0.8rem;
}

.qa-answer-text ul, .qa-answer-text ol {
  margin: 0.6rem 0 0.8rem 1.2rem;
}

.qa-answer-text li {
  margin-bottom: 0.4rem;
}

.qa-answer-text strong {
  color: var(--text);
  font-weight: 700;
}

.qa-cross-links {
  margin-top: 1.2rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.qa-cross-link {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--accent-dim);
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.15);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.qa-cross-link:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: rgba(212, 168, 67, 0.2);
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}

.empty-state .icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.empty-state p {
  font-size: 0.9rem;
}

/* ===== FOOTER ===== */
.footer {
  border-top: 1px solid var(--border);
  padding: 2rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero-stats { gap: 1.5rem; }
  .stat-number { font-size: 2rem; }
  .ai-card { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
  .ai-chat-area { max-width: 100%; width: 100%; }
  .qa-answer-inner { padding-left: 1.5rem; }
  .qa-tags { display: none; }
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 0.75rem; }
  .filter-controls { width: 100%; justify-content: space-between; margin-top: 10px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">KB</div>
      <span class="logo-text">知识库</span>
      <span class="logo-version">v1.0</span>
    </a>
    <nav class="nav-links">
      <a href="#" class="active">问答</a>
      <a href="#ai-section">AI 助手</a>
      <a href="#">关于</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-stats">
    <div class="stat">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">问答条目</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="tagCount">0</span>
      <span class="stat-label">知识标签</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="linkCount">0</span>
      <span class="stat-label">交叉链接</span>
    </div>
  </div>
  <h1 class="hero-title">
    <strong>99 个问答全景</strong> · 一键检索 · 交叉溯源
  </h1>
  <div class="search-container">
    <span class="search-icon">⌕</span>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索问题、关键词、标签……" autocomplete="off">
    <div class="search-hint">按 <kbd>/</kbd> 聚焦搜索 · 按 <kbd>Esc</kbd> 清除</div>
  </div>
</section>

<!-- AI CHAT -->
<section class="ai-section" id="ai-section">
  <div class="ai-card">
    <div class="ai-info">
      <div class="ai-badge">BETA</div>
      <h2 class="ai-title">智能问答助手</h2>
      <p class="ai-desc">
        有疑问？直接提问，AI 基于知识库原文为你解答。<br>
        每个回答都会标注来源条目，方便溯源验证。
      </p>
    </div>
    <div class="ai-chat-area">
      <div class="ai-messages" id="aiMessages">
        <div class="ai-msg bot">
          你好！我可以基于知识库的 99 个问答为你解答。试试问我点什么？
        </div>
      </div>
      <div class="ai-input-row">
        <input type="text" class="ai-input" id="aiInput" placeholder="输入你的问题……">
        <button class="ai-send" id="aiSend">提问</button>
      </div>
    </div>
  </div>
</section>

<!-- FILTERS -->
<div class="filters" id="filters">
  <span class="filter-label">分类</span>
  <button class="filter-btn active" data-tag="all">全部</button>
  <div class="filter-controls">
    <button class="toggle-all-btn" id="toggleAllBtn" onclick="toggleAllCards()">折叠全部</button>
    <span class="filter-count" id="filterCount">显示 0 / 0</span>
  </div>
</div>

<!-- Q&A LIST -->
<div class="qa-list" id="qaList"></div>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState" style="display:none;">
  <div class="icon">⌕</div>
  <p>没有找到匹配的结果，试试其他关键词？</p>
</div>

<!-- FOOTER -->
<footer class="footer">
  知识库 v1.0 · 持续更新中
</footer>

<!-- 引入同目录下的 QA_DATA.js -->
<script src="./QA_DATA.js"></script>

<script>
// 数据加载检测
if (typeof QA_DATA === 'undefined') {
  console.error('未检测到 QA_DATA 变量，请确认 QA_DATA.js 文件存在并已声明 const QA_DATA = [...]');
  window.QA_DATA = [];
}

const qaList = document.getElementById('qaList');
const searchInput = document.getElementById('searchInput');
const filtersContainer = document.getElementById('filters');
const filterCount = document.getElementById('filterCount');
const emptyState = document.getElementById('emptyState');
const aiMessages = document.getElementById('aiMessages');
const aiInput = document.getElementById('aiInput');
const aiSend = document.getElementById('aiSend');
const toggleAllBtn = document.getElementById('toggleAllBtn');

let activeTag = 'all';
let searchQuery = '';
let isAllExpanded = true; // 默认全部展开

function initApp() {
  if (!QA_DATA || QA_DATA.length === 0) {
    emptyState.style.display = 'block';
    emptyState.innerHTML = '<div class="icon">⚠️</div><p style="color:#d4a843;">未检测到问答数据，请检查 QA_DATA.js 是否已上传至 GitHub 仓库根目录。</p>';
    return;
  }

  // 渲染顶部统计
  document.getElementById('totalCount').textContent = QA_DATA.length;
  const allTags = [...new Set(QA_DATA.flatMap(q => q.tags || []))].sort();
  document.getElementById('tagCount').textContent = allTags.length;
  document.getElementById('linkCount').textContent = QA_DATA.reduce((sum, q) => sum + (q.links ? q.links.length : 0), 0);

  // 渲染分类筛选按钮
  const controlsDiv = document.querySelector('.filter-controls');
  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    filtersContainer.insertBefore(btn, controlsDiv);
  });

  renderList();
}

function renderList() {
  const filtered = QA_DATA.filter(item => {
    const matchTag = activeTag === 'all' || (item.tags && item.tags.includes(activeTag));
    const matchSearch = !searchQuery ||
      (item.q && item.q.toLowerCase().includes(searchQuery)) ||
      (item.a && item.a.toLowerCase().includes(searchQuery)) ||
      (item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery)));
    return matchTag && matchSearch;
  });

  filterCount.textContent = `显示 ${filtered.length} / ${QA_DATA.length}`;

  if (filtered.length === 0) {
    qaList.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  // 默认每一项都带 open 类名，直接展示内容
  qaList.innerHTML = filtered.map((item) => `
    <div class="qa-item open" data-id="${item.id}">
      <div class="qa-question" onclick="toggleQA(this.parentElement)">
        <span class="qa-number">#${String(item.id).padStart(2, '0')}</span>
        <span class="qa-q-text">${highlightText(item.q)}</span>
        <div class="qa-tags">
          ${(item.tags || []).map(t => `<span class="qa-tag">${t}</span>`).join('')}
        </div>
        <span class="qa-toggle">+</span>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-text">${highlightText(item.a)}</div>
          ${item.links && item.links.length > 0 ? `
            <div class="qa-cross-links">
              <span style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);margin-right:4px;">关联条目 →</span>
              ${item.links.map(l => {
                const linked = QA_DATA.find(q => q.id === l);
                return linked ? `<a class="qa-cross-link" onclick="scrollToQA(${l})">#${String(l).padStart(2,'0')} ${linked.q.slice(0,14)}…</a>` : '';
              }).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function highlightText(text) {
  if (!text) return '';
  if (!searchQuery) return text;
  const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark style="background:var(--accent);color:var(--bg);padding:0 2px;border-radius:2px;">$1</mark>');
}

function toggleQA(el) {
  el.classList.toggle('open');
}

// 一键展开 / 折叠全部卡片
function toggleAllCards() {
  const items = document.querySelectorAll('.qa-item');
  isAllExpanded = !isAllExpanded;
  items.forEach(item => {
    if (isAllExpanded) {
      item.classList.add('open');
    } else {
      item.classList.remove('open');
    }
  });
  toggleAllBtn.textContent = isAllExpanded ? '折叠全部' : '展开全部';
}

function scrollToQA(id) {
  const el = document.querySelector(`.qa-item[data-id="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('open');
    el.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => el.style.boxShadow = '', 2000);
  }
}

// 标签筛选
filtersContainer.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  filtersContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeTag = e.target.dataset.tag;
  renderList();
});

// 实时搜索
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderList();
  }, 200);
});

// 快捷键支持
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== aiInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchQuery = '';
    searchInput.blur();
    renderList();
  }
});

// AI 智能问答
function sendAIMessage() {
  const question = aiInput.value.trim();
  if (!question) return;

  const userDiv = document.createElement('div');
  userDiv.className = 'ai-msg user';
  userDiv.textContent = question;
  aiMessages.appendChild(userDiv);

  const keywords = question.toLowerCase().split(/[\s,，。？！?!.]+/).filter(k => k.length > 1);
  const scored = QA_DATA.map(item => {
    let score = 0;
    const text = (item.q + ' ' + item.a + ' ' + (item.tags || []).join(' ')).toLowerCase();
    keywords.forEach(kw => {
      if (text.includes(kw)) score += 1;
      if (item.q && item.q.toLowerCase().includes(kw)) score += 2;
    });
    return { ...item, score };
  }).filter(item => item.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

  const botDiv = document.createElement('div');
  botDiv.className = 'ai-msg bot';

  if (scored.length > 0) {
    let html = `<div style="margin-bottom:8px;">根据知识库，找到 ${scored.length} 个相关条目：</div>`;
    scored.forEach((item, i) => {
      const plainA = (item.a || '').replace(/<[^>]*>/g, '');
      html += `<div style="margin-bottom:10px;">`;
      html += `<strong>${i + 1}.</strong> ${plainA.slice(0, 100)}…<br>`;
      html += `<span class="source" onclick="scrollToQA(${item.id})">📎 来源: #${String(item.id).padStart(2, '0')}「${item.q.slice(0, 25)}」</span>`;
      html += `</div>`;
    });
    botDiv.innerHTML = html;
  } else {
    botDiv.innerHTML = '抱歉，知识库中暂未找到与该问题直接相关的内容。<br>试试换个关键词提问？';
  }

  aiMessages.appendChild(botDiv);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  aiInput.value = '';
}

aiSend.addEventListener('click', sendAIMessage);
aiInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendAIMessage();
});

// DOM 就绪后启动
window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
