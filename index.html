<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · 99 问答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b09;
  --surface: #161412;
  --surface-2: #1e1b18;
  --surface-3: #282420;
  --accent: #d4a843;
  --accent-dim: #a07e2e;
  --accent-glow: rgba(212, 168, 67, 0.12);
  --text: #e8e2d6;
  --text-muted: #8a8278;
  --text-dim: #5a554e;
  --border: #2a2622;
  --tag-bg: #1e1b16;
  --tag-text: #b8a878;
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --mono: 'JetBrains Mono', 'Menlo', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
}

::selection {
  background: var(--accent);
  color: var(--bg);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12, 11, 9, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 18px;
  color: var(--bg);
  font-family: var(--mono);
}

.logo-text {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.logo-version {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  background: var(--surface-2);
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 4px;
}

.nav-links {
  display: flex;
  gap: 2rem;
  align-items: center;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--accent); }
.nav-links a.active { color: var(--accent); }

/* ===== HERO ===== */
.hero {
  max-width: 1400px;
  margin: 0 auto;
  padding: 5rem 2rem 3rem;
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.8s ease forwards;
}

.stat {
  text-align: center;
}

.stat-number {
  font-family: var(--mono);
  font-size: 2.8rem;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
  display: block;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0.08em;
}

.hero-title {
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 2.5rem;
  animation: fadeUp 0.8s ease 0.15s forwards;
  opacity: 0;
}

.hero-title strong {
  color: var(--text);
  font-weight: 700;
}

/* ===== SEARCH ===== */
.search-container {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  animation: fadeUp 0.8s ease 0.3s forwards;
  opacity: 0;
}

.search-box {
  width: 100%;
  padding: 16px 20px 16px 52px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.search-box::placeholder { color: var(--text-dim); }

.search-box:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1.1rem;
  pointer-events: none;
}

.search-hint {
  text-align: center;
  margin-top: 12px;
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
}

.search-hint kbd {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 0.7rem;
}

/* ===== AI CHAT SECTION ===== */
.ai-section {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 2rem 3rem;
}

.ai-card {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem;
  display: flex;
  align-items: center;
  gap: 3rem;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s ease 0.45s forwards;
  opacity: 0;
}

.ai-card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(212, 168, 67, 0.06) 0%, transparent 70%);
  pointer-events: none;
}

.ai-info { flex: 1; }

.ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(212, 168, 67, 0.1);
  border: 1px solid rgba(212, 168, 67, 0.2);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 1rem;
  letter-spacing: 0.06em;
}

.ai-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

.ai-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.ai-desc {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.7;
}

.ai-chat-area {
  flex: 1;
  max-width: 480px;
}

.ai-messages {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  height: 200px;
  overflow-y: auto;
  margin-bottom: 12px;
  font-size: 0.85rem;
  line-height: 1.7;
}

.ai-msg {
  margin-bottom: 0.8rem;
  padding: 8px 12px;
  border-radius: 8px;
}

.ai-msg.user {
  background: var(--surface-3);
  color: var(--text);
  margin-left: 2rem;
}

.ai-msg.bot {
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.1);
  margin-right: 2rem;
}

.ai-msg .source {
  display: block;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent-dim);
  margin-top: 6px;
  cursor: pointer;
}

.ai-msg .source:hover { color: var(--accent); }

.ai-input-row {
  display: flex;
  gap: 8px;
}

.ai-input {
  flex: 1;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--serif);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}

.ai-input:focus { border-color: var(--accent-dim); }

.ai-send {
  padding: 10px 20px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.ai-send:hover { background: #e0b64e; }
.ai-send:active { transform: scale(0.97); }

/* ===== FILTERS ===== */
.filters {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 1.5rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  animation: fadeUp 0.8s ease 0.5s forwards;
  opacity: 0;
}

.filter-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--mono);
  margin-right: 8px;
  letter-spacing: 0.06em;
}

.filter-btn {
  padding: 6px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-family: var(--serif);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--accent-dim);
  color: var(--text);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 700;
}

.filter-count {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-left: auto;
}

/* ===== Q&A LIST ===== */
.qa-list {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 4rem;
  display: grid;
  gap: 12px;
}

.qa-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
  cursor: pointer;
  opacity: 0;
  animation: fadeUp 0.5s ease forwards;
}

.qa-item:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}

.qa-item.open {
  border-color: var(--accent-dim);
}

.qa-question {
  padding: 1.2rem 1.5rem;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.qa-number {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--accent-dim);
  background: var(--accent-glow);
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.qa-q-text {
  flex: 1;
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.6;
}

.qa-tags {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 2px;
}

.qa-tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--tag-text);
  background: var(--tag-bg);
  border: 1px solid rgba(184, 168, 120, 0.15);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.qa-toggle {
  color: var(--text-dim);
  font-size: 1.2rem;
  transition: transform 0.3s, color 0.3s;
  flex-shrink: 0;
  margin-top: 2px;
}

.qa-item.open .qa-toggle {
  transform: rotate(45deg);
  color: var(--accent);
}

.qa-answer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s ease;
}

.qa-item.open .qa-answer {
  max-height: 800px;
}

.qa-answer-inner {
  padding: 0 1.5rem 1.5rem;
  padding-left: calc(1.5rem + 14px + 44px);
}

.qa-answer-text {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.9;
  border-left: 2px solid var(--accent-dim);
  padding-left: 1rem;
}

.qa-answer-text strong {
  color: var(--text);
}

.qa-cross-links {
  margin-top: 1rem;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.qa-cross-link {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--accent-dim);
  background: var(--accent-glow);
  border: 1px solid rgba(212, 168, 67, 0.1);
  padding: 3px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.qa-cross-link:hover {
  color: var(--accent);
  border-color: var(--accent-dim);
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}

.empty-state .icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.3;
}

.empty-state p {
  font-size: 0.9rem;
}

/* ===== FOOTER ===== */
.footer {
  border-top: 1px solid var(--border);
  padding: 2rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero-stats { gap: 1.5rem; }
  .stat-number { font-size: 2rem; }
  .ai-card { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
  .ai-chat-area { max-width: 100%; width: 100%; }
  .qa-answer-inner { padding-left: 1.5rem; }
  .qa-tags { display: none; }
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 0.75rem; }
}
</style>
</head>

  </div>
</section>

<!-- FILTERS -->
<div class="filters" id="filters">
  <span class="filter-label">筛选</span>

<!-- Q&A LIST -->
<div class="qa-list" id="qaList"></div>

<!-- EMPTY STATE -->

<!-- FOOTER -->
<footer class="footer">
  知识库 v1.0 · 共 99 条问答 · 持续更新中

// ============================================================
//  APP LOGIC
// ============================================================

const qaList = document.getElementById('qaList');
const searchInput = document.getElementById('searchInput');
const filtersContainer = document.getElementById('filters');
const filterCount = document.getElementById('filterCount');
const emptyState = document.getElementById('emptyState');
const aiMessages = document.getElementById('aiMessages');
const aiInput = document.getElementById('aiInput');
const aiSend = document.getElementById('aiSend');

// Collect all unique tags
const allTags = [...new Set(QA_DATA.flatMap(q => q.tags))].sort();
const tagCount = document.getElementById('tagCount');
const linkCount = document.getElementById('linkCount');
tagCount.textContent = allTags.length;
linkCount.textContent = QA_DATA.reduce((sum, q) => sum + q.links.length, 0);

// Render filter buttons
allTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.tag = tag;
  btn.textContent = tag;
  filtersContainer.insertBefore(btn, filterCount);
});

let activeTag = 'all';
let searchQuery = '';

function renderList() {
  const filtered = QA_DATA.filter(item => {
    const matchTag = activeTag === 'all' || item.tags.includes(activeTag);
    const matchSearch = !searchQuery ||
      item.q.toLowerCase().includes(searchQuery) ||
      item.a.toLowerCase().includes(searchQuery) ||
      item.tags.some(t => t.toLowerCase().includes(searchQuery));
    return matchTag && matchSearch;
  });

  filterCount.textContent = `显示 ${filtered.length} / ${QA_DATA.length}`;

  if (filtered.length === 0) {
    qaList.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  qaList.innerHTML = filtered.map((item, i) => `
    <div class="qa-item" data-id="${item.id}" style="animation-delay: ${Math.min(i * 0.04, 0.6)}s">
      <div class="qa-question" onclick="toggleQA(this.parentElement)">
        <span class="qa-number">#${String(item.id).padStart(2, '0')}</span>
        <span class="qa-q-text">${highlightText(item.q)}</span>
        <div class="qa-tags">
          ${item.tags.map(t => `<span class="qa-tag">${t}</span>`).join('')}
        </div>
        <span class="qa-toggle">+</span>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-text">${highlightText(item.a)}</div>
          ${item.links.length > 0 ? `
            <div class="qa-cross-links">
              <span style="font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);margin-right:4px;">关联 →</span>
              ${item.links.map(l => {
                const linked = QA_DATA.find(q => q.id === l);
                return linked ? `<a class="qa-cross-link" onclick="scrollToQA(${l})">#${String(l).padStart(2,'0')} ${linked.q.slice(0,12)}…</a>` : '';
              }).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function highlightText(text) {
  if (!searchQuery) return text;
  const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark style="background:var(--accent);color:var(--bg);padding:0 2px;border-radius:2px;">$1</mark>');
}

function toggleQA(el) {
  el.classList.toggle('open');
}

function scrollToQA(id) {
  const el = document.querySelector(`.qa-item[data-id="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('open');
    el.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => el.style.boxShadow = '', 2000);
  }
}

// Filter click
filtersContainer.addEventListener('click', e => {
  if (!e.target.classList.contains('filter-btn')) return;
  filtersContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeTag = e.target.dataset.tag;
  renderList();
});

// Search
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value.trim().toLowerCase();
    renderList();
  }, 200);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput && document.activeElement !== aiInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchQuery = '';
    searchInput.blur();
    renderList();
  }
});

// AI Chat
function sendAIMessage() {
  const question = aiInput.value.trim();
  if (!question) return;

  // User message
  const userDiv = document.createElement('div');
  userDiv.className = 'ai-msg user';
  userDiv.textContent = question;
  aiMessages.appendChild(userDiv);

  // Find relevant Q&As
  const keywords = question.toLowerCase().split(/[\s,，。？！?!.]+/).filter(k => k.length > 1);
  const scored = QA_DATA.map(item => {
    let score = 0;
    const text = (item.q + ' ' + item.a + ' ' + item.tags.join(' ')).toLowerCase();
    keywords.forEach(kw => {
      if (text.includes(kw)) score += 1;
      if (item.q.toLowerCase().includes(kw)) score += 2;
    });
    return { ...item, score };
  }).filter(item => item.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

  // Bot response
  const botDiv = document.createElement('div');
  botDiv.className = 'ai-msg bot';

  if (scoreed.length > 0) {
    let response = `根据知识库，找到 ${scoreed.length} 个相关条目：\n\n`;
    scored.forEach((item, i) => {
      const plainA = item.a.replace(/<[^>]*>/g, '');
      response += `${i + 1}. ${plainA.slice(0, 80)}…\n`;
      response += `   📎 来源: #${String(item.id).padStart(2, '0')}「${item.q.slice(0, 20)}」\n\n`;
    });
    botDiv.innerHTML = response.replace(/\n/g, '<br>').replace(/📎 来源: #(\d+)「([^」]+)」/g,
      '<span class="source" onclick="scrollToQA($1)">📎 来源: #$1「$2」</span>');
  } else {
    botDiv.innerHTML = '抱歉，知识库中暂未找到与该问题直接相关的内容。<br>试试换个关键词提问？';
  }

  aiMessages.appendChild(botDiv);
  aiMessages.scrollTop = aiMessages.scrollHeight;
  aiInput.value = '';
}

aiSend.addEventListener('click', sendAIMessage);
aiInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendAIMessage();
});

// Initial render
renderList();
</script>
